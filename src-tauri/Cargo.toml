[package]
name = "audio-alchemy"
version = "0.1.0"
description = "Audio Alchemy desktop shell"
authors = ["Audio Alchemy"]
edition = "2021"

[lib]
name = "audio_alchemy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "audio-alchemy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
